name: Test Self-Hosted Runner

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Print runner info
        run: |
          echo "Hello from self-hosted runner!"
          uname -a
          hostname
          echo "Repository files:"
          ls -lah