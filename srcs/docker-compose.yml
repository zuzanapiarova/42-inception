services:
  nginx:
    build: "./requirements/nginx"
    image: nginx
    networks:
      - backend
    depends_on:
      - wordpress
    ports:
      - "81:80"
      - "443:443"
    volumes:
      - wordpress-site:/var/www/html:ro # read-only
      - ./.keys/ssl:/etc/ssl # mount keys instead of copying so they are not baked into the image
    restart: "on-failure"
    # TODO: keys are not valid - also is there a better way than to mount them ? can they be generated with make always and pu to continer some other way ?

  wordpress:
    build: "./requirements/wordpress"
    image: wordpress
    expose:
      - "9000"
    networks:
      - backend
    depends_on:
      - mariadb
    volumes:
      - wordpress-site:/var/www/html
    restart: "on-failure"
    environment:
      WORDPRESS_DB_HOST: mariadb:${DB_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_USER: ${WORDPRESS_USER}
      WORDPRESS_USER_EMAIL: ${WORDPRESS_USER_EMAIL}
      WORDPRESS_USER_PASSWORD: ${WORDPRESS_USER_PASSWORD}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_PASSWORD: ${REDIS_PASSWORD}

  mariadb: 
    build: "./requirements/mariadb"
    image: mariadb
    expose:
      - "3306"
    networks:
      - backend
    volumes:
      - wordpress-data:/var/lib/mysql
    restart: "on-failure"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  # bonus:
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer
    restart: "on-failure"
    ports: 
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - backend

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp
    restart: "on-failure"
    ports: 
      - "21:21"
      - "30000-30009:30000-30009"
    depends_on:
      - wordpress
    volumes:
      - wordpress-site:/var/www/html
    networks:
      - backend  
    environment:
      FTP_USER: ${WORDPRESS_ADMIN_USER}
      FTP_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      DOMAIN_NAME: ${DOMAIN_NAME}

  redis:
    build: ./requirements/bonus/redis
    image: redis
    ports:
      - 6379:6379
    networks:
      - backend
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  github_actions:
    build:
      context: ./requirements/bonus/github_actions
      args:
        RUNNER_VERSION: ${RUNNER_VERSION}
    image: github_actions
    # volumes:
    #   - github-actions-data:/runner
    networks:
      - backend
    restart: on-failure
    environment:
      GITHUB_URL: ${GITHUB_URL} # can these stay here? If i remove them, will they not propagate to github ? 
      RUNNER_TOKEN: ${RUNNER_TOKEN} # ! RUNNER_TOKEN from GitHub expires after registration - get new one from github actions site. For long-term setups, enterprises use ephemeral runners or actions-runner-controller to auto-refresh tokens
      RUNNER_NAME: ${RUNNER_NAME}
      $USER_ACCESS_TOKEN: ${USER_ACCESS_TOKEN}
      RUNNER_VERSION: ${RUNNER_VERSION}
      RUNNER_HOME: ${RUNNER_HOME} # mount for gha data goes here

# named volumes backed by a specific host directories
volumes:
  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress-data
  wordpress-site:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress-site
  # github-actions-data: TODO

# blocks can be empty if we want the default config, compose will create them automatically
networks:
  backend:
    driver: bridge